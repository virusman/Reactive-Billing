apply plugin: 'com.android.library'
apply plugin: 'maven-publish'

android {
    compileSdk 34

    defaultConfig {
        minSdkVersion 21
        targetSdkVersion 34
        versionCode 1
        versionName "1.0"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }

    publishing {
        singleVariant("release") {
            withSourcesJar()
            withJavadocJar()
        }
    }
}

dependencies {
    compileOnly 'io.reactivex:rxjava:1.1.3'
    compileOnly 'io.reactivex:rxandroid:1.2.0'
    implementation 'com.jakewharton.rxrelay:rxrelay:1.2.0'
    implementation 'com.android.billingclient:billing:7.1.1'
}

afterEvaluate {
    publishing {
        publications {
            release(MavenPublication) {
                from components.release
                groupId = 'com.github.lukaspili'
                artifactId = 'reactive-billing'
                version = '0.3-SNAPSHOT'

                pom {
                    name = 'reactive-billing'
                    description = 'Reactive Billing for Android'
                }
            }
        }
    }
}